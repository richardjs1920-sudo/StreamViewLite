name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source.zip
        run: unzip -q source.zip

      - name: Locate Gradle project
        run: |
          set -e
          SETTINGS=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle.kts found after extracting."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStreamApp
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
